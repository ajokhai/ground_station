[workspace]
name = "ground_station"
version = "0.1.0"
description = "ROS 2 ground station package for USV swarm formations"
authors = ["chenhangwei <chenhangwei77777@hotmail.com>"]
channels = [
    "https://prefix.dev/robostack-humble",
    "conda-forge"
]
platforms = ["osx-arm64"]

[dependencies]
ros-humble-desktop = "*"
colcon-common-extensions = "*"
compilers = "*"
cmake = "*"
pkg-config = "*"
ninja = "*"

[tasks]
build = "colcon build --symlink-install"
run = "python -m ground_station.ground_station_node"
launch = { cmd = "bash -c 'source install/setup.bash && ros2 launch ground_station ground_station.launch.py'", depends-on = ["build"] }
test = "colcon test && colcon test-result --all"


